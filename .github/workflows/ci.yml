name: CI

on:
  push:
    branches: [main, monflash, "feat/**"]
  pull_request:
    branches: [main, monflash]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build e tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # --frozen-lockfile: o repo traz pnpm-lock.yaml. npm resolveria
      # react-hook-form num patch novo e quebraria o type-check.
      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      # Falha se design-tokens.json foi alterado sem regenerar tokens.css.
      - name: Conferir tokens de design
        run: node scripts/build-tokens.mjs --check

      - name: Build
        run: pnpm build

  testes:
    name: Visuais e acessibilidade
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build

      - name: Rodar testes
        run: pnpm exec playwright test

      # O diff de pixels é o artefato que explica uma falha visual.
      - name: Guardar diff e relatório
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            tests/visual/diff/
            playwright-report/
            test-results/
          retention-days: 7
